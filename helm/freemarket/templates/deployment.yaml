apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freemarket.fullname" . }}
  labels:
    {{- include "freemarket.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "freemarket.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "freemarket.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the Deployment whenever the ConfigMap or Secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "freemarket.postgresql.fullname" . }} {{ .Values.config.postgresPort }}; do
                echo "waiting for postgresql…"
                sleep 2
              done
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "freemarket.fullname" . }}-config
            - secretRef:
                name: {{ include "freemarket.fullname" . }}-credentials
          # Spring Boot takes ~30-60 s to start; startupProbe gives it up to 2 minutes
          # before liveness kicks in, so we don't kill slow-starting pods.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 24
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
