# Non-sensitive Minikube overrides — safe to commit.
# Credentials live in values-local.secrets.yaml (gitignored).
#
# First-time setup:
#   cp helm/freemarket/values-local.secrets.yaml.example \
#      helm/freemarket/values-local.secrets.yaml
#   # fill in your local credentials
#
# Deploy:
#   helm upgrade --install freemarket ./helm/freemarket \
#     -f ./helm/freemarket/values-local.yaml \
#     -f ./helm/freemarket/values-local.secrets.yaml \
#     --wait
#
# Or just run: ./scripts/minikube-dev.sh

image:
  pullPolicy: Never   # use the locally-built image; never pull from a registry

service:
  type: NodePort      # expose via minikube service instead of port-forward
